# ─────────────────────────────────────────────────────────────
#  progress.toml — the ONLY file you need to edit to update
#  the progress card on your GitHub profile.
#
#  Edit it on github.com (pencil icon), commit, and the
#  "Update profile" Action redraws the card in about a minute.
# ─────────────────────────────────────────────────────────────

[journey]
title = "ML + Robotics Journey"
started = "Oct 2026"
plan_weeks = 104            # 2-year plan
weeks_completed = 2         # bump this when you finish a week
current_week = 3            # auto-detected from weekNN folders in ml-journey (this is the fallback)
streak_days = 22            # study streak from the ML Journey app — update it when you like
focus = "Python foundations + maths for ML"

# Where your practice code lives. Commits here feed the Learning Log
# and the "practice commits" tile automatically.
practice_repo = "ml-journey"

# Stages of the roadmap. status = "done" | "now" | "next" | "later"
[[stages]]
name = "Python basics"
status = "now"

[[stages]]
name = "Maths for ML"
status = "now"

[[stages]]
name = "NumPy + pandas"
status = "next"

[[stages]]
name = "Classic ML"
status = "later"

[[stages]]
name = "Deep learning"
status = "later"

[[stages]]
name = "Robotics (sim)"
status = "later"

# Self-rated skill levels, 1 (just started) to 5 (could teach it).
# Be honest — watching these climb IS the point.
[[skills]]
name = "HTML"
level = 4

[[skills]]
name = "CSS"
level = 5

[[skills]]
name = "Python"
level = 2

[[skills]]
name = "JavaScript"
level = 2

[[skills]]
name = "Git + GitHub"
level = 2

[[skills]]
name = "SQL / Supabase"
level = 2

[[skills]]
name = "C++"
level = 1

[[skills]]
name = "Maths for ML"
level = 1

# Achievements card. Flip done = true to unlock one (it turns gold).
# For a locked goal with a number, give current + target and it shows a progress bar.
# current = "streak" reads streak_days from above automatically.
[[achievements]]
name = "First client website"
sub = "KD Wisdom Enterprise"
done = true

[[achievements]]
name = "Live MoMo + card payments"
sub = "on a real store"
done = true

[[achievements]]
name = "Week 1 complete"
sub = "71/71 tasks"
done = true

[[achievements]]
name = "Week 2 complete"
sub = "Python + statistics"
done = true

[[achievements]]
name = "Study Squad launched"
sub = "3 learning tracks"
done = true

[[achievements]]
name = "30-day study streak"
done = false
current = "streak"
target = 30

[[achievements]]
name = "Python + maths foundations"
